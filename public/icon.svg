<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#0f0f11"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="fp-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4f00"/>
      <stop offset="65%" stop-color="#ff6b26"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="fp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Industrial Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#fp-bg)" stroke="#27272a" stroke-width="8"/>
  <rect x="52" y="52" width="408" height="408" rx="88" fill="none" stroke="#ff4f00" stroke-opacity="0.16" stroke-width="2.5" stroke-dasharray="14 10"/>

  <!-- Precision Corner Calibrators (Swiss Metric) -->
  <path d="M68 96 V68 H96 M416 68 H444 V96 M444 416 V444 H416 M96 444 H68 V416" stroke="#3f3f46" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Matrix Grid Reference Nodes -->
  <circle cx="140" cy="140" r="3.5" fill="#27272a"/>
  <circle cx="372" cy="140" r="3.5" fill="#27272a"/>
  <circle cx="140" cy="372" r="3.5" fill="#27272a"/>
  <circle cx="372" cy="372" r="3.5" fill="#27272a"/>

  <!-- Left Syntax Bracket (Format) -->
  <path d="M192 152 L124 256 L192 360" stroke="#ff4f00" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right Syntax Bracket (Format) -->
  <path d="M320 152 L388 256 L320 360" stroke="#ff4f00" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Electric Telemetry Pulse Heartline -->
  <path d="M148 256 H206 L236 168 L276 344 L306 256 H364" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#fp-glow)"/>
  <path d="M148 256 H206 L236 168 L276 344 L306 256 H364" stroke="url(#fp-pulse)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Zero-Knowledge Live Sentinel Status Indicator -->
  <circle cx="364" cy="256" r="24" fill="#10b981" fill-opacity="0.22"/>
  <circle cx="364" cy="256" r="13" fill="#10b981" stroke="#09090b" stroke-width="3"/>
  <circle cx="364" cy="256" r="4.5" fill="#ffffff"/>
</svg>