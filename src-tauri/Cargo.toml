[package]
name = "formatpulse"
version = "1.2.0"
description = "FormatPulse — Zero-Knowledge Local Data Studio"
authors = ["FormatPulse Security Engineering <security@formatpulse.internal>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
